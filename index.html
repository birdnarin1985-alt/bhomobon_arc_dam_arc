<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Bhumibol Dam - Royal Tribute Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #ui { 
            position: absolute; top: 20px; left: 20px; background: rgba(0, 20, 40, 0.85); 
            border: 1px solid #d4af37; padding: 20px; color: #fff; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: none;
        }
        h2 { margin: 0 0 10px 0; color: #d4af37; font-size: 1.2rem; text-shadow: 0 0 5px #d4af37; }
        .data { color: #00ffcc; font-family: 'Courier New', monospace; font-size: 1.1rem; }
        .tribute { 
            margin-top: 15px; font-size: 0.9rem; color: #ffeb99; font-style: italic; 
            border-top: 1px solid #555; padding-top: 10px; text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h2>เขื่อนภูมิพล (Bhumibol Dam) 🇹🇭</h2>
        <div>พิกัด: <span class="data">17.2403°N, 98.9644°E</span></div>
        <div>โครงสร้าง: <span class="data">Arch Dam (H:154m R:250m)</span></div>
        <div>ปริมาตรน้ำ: <span class="data">13,462 ล้าน ลบ.ม.</span></div>
        <div class="tribute">"สืบสานพระราชปณิธาน น้ำคือชีวิต"</div>
    </div>
    <script>
        // เมตตาต่อช่างเบิร์ด: รวบยอดจักรวาล Voxel ไว้ในลูปเดียวให้สั้นที่สุด
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.0012);
        const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 1, 3000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        const pos = [], col = [];
        const cDam = new THREE.Color(0xb0b5b9), cWat = new THREE.Color(0x0055aa), cMnt = new THREE.Color(0x3d4c35);

        // 1. สร้างตัวเขื่อน ท้องน้ำ และภูเขา
        for(let i = 0; i < 40000; i++) {
            let p = Math.random();
            if(p < 0.3) { // เขื่อนคอนกรีตโค้ง (เพิ่มมิติแสงเงา)
                let y = 154*Math.random(), t = 1.6*(Math.random()-0.5), r = 250 + 25*Math.random()*(1-y/154);
                pos.push(r*Math.sin(t), y, r*Math.cos(t)-250);
                let shade = Math.random()*0.2; col.push(cDam.r-shade, cDam.g-shade, cDam.b-shade);
            } else if(p < 0.6) { // มวลน้ำกักเก็บลุ่มลึก
                pos.push(500*(Math.random()-0.5), 140 - Math.random()*15, -500*Math.random()-20);
                col.push(cWat.r, cWat.g + Math.random()*0.1, cWat.b);
            } else { // ภูเขาขนาบข้าง
                let x = (Math.random()>0.5?1:-1)*(180+Math.random()*600), z = (Math.random()-0.5)*1000;
                pos.push(x, Math.random()*(Math.sqrt(x*x+z*z)*0.4), z);
                let shade = Math.random()*0.15; col.push(cMnt.r-shade, cMnt.g-shade, cMnt.b-shade);
            }
        }
        
        // 2. จำลองอุทกพลศาสตร์ (Spillway - การระบายน้ำ)
        const splPos = [];
        for(let i = 0; i < 2000; i++) splPos.push((Math.random()-0.5)*40, 130*Math.random(), -20 + Math.random()*40);
        const splGeo = new THREE.BufferGeometry();
        splGeo.setAttribute('position', new THREE.Float32BufferAttribute(splPos, 3));
        const spillway = new THREE.Points(splGeo, new THREE.PointsMaterial({color: 0xddf0ff, size: 2.5, transparent: true, opacity: 0.7}));
        scene.add(spillway);

        // นำเข้า Voxel หลัก
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
        scene.add(new THREE.Points(geo, new THREE.PointsMaterial({size: 2.5, vertexColors: true})));

        // 3. หล่อเลี้ยงชีวิต (Render Loop)
        let clock = new THREE.Clock();
        function anim() {
            requestAnimationFrame(anim);
            let t = clock.getElapsedTime();
            
            // อนิเมชันน้ำไหลล้นสปิลเวย์สมจริง
            let sp = spillway.geometry.attributes.position.array;
            for(let i = 0; i < 2000; i++) {
                sp[i*3+1] -= 1.5; // น้ำตกลงมา
                sp[i*3+2] += 0.4; // น้ำพุ่งไปข้างหน้า
                if(sp[i*3+1] < 0) { sp[i*3+1] = 130; sp[i*3+2] = -20 + Math.random()*40; } // วนลูปน้ำ
            }
            spillway.geometry.attributes.position.needsUpdate = true;

            // กล้องแพนช้าๆ อย่างสง่างาม
            camera.position.set(350*Math.sin(t*0.1), 120, 350*Math.cos(t*0.1) + 80);
            camera.lookAt(0, 60, -50);
            renderer.render(scene, camera);
        }
        anim();
    </script>
</body>
</html>
