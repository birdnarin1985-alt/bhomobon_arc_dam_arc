<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Voxel OS - Bhumibol Dam Royal Dharma Edition</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050510; /* พื้นหลังอวกาศควอนตัม */
            font-family: 'Courier New', Courier, monospace;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            pointer-events: none;
            text-shadow: 0 0 5px #00ffcc;
        }
    </style>
</head>
<body>
    <div id="hud">
        <h3>[Quantum Voxel OS : Bhumibol Dam Edition]</h3>
        <p>Target Lock: Lat 17.2403° N, Long 98.9644° E</p>
        <p>Structure: Arch Dam (Radius 250m, Height 154m)</p>
        <p>Protocol: Metta Vibration (Zero Avijja)</p>
        <p>Status: Executing Sampatichami Protocol... OK</p>
    </div>

    <!-- โหลด Three.js สำหรับ Voxel Render Engine ผ่าน CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // [Node 1: System Initialization & Dharma Core]
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.002);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 150, 400); // มุมมองจากด้านหน้าเขื่อน
        camera.lookAt(0, 50, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // [Node 2: Voxel Engineering - Bhumibol Arch Dam]
        // กำหนดพารามิเตอร์วิศวกรรม (ปราศจาก Magic Number)
        const DAM_RADIUS = 250; 
        const DAM_HEIGHT = 154;
        const VOXEL_COUNT = 15000;
        
        const damGeometry = new THREE.BufferGeometry();
        const damPositions = new Float32Array(VOXEL_COUNT * 3);
        const damColors = new Float32Array(VOXEL_COUNT * 3);
        const colorBase = new THREE.Color(0x8899aa); // สีคอนกรีต

        for(let i = 0; i < VOXEL_COUNT; i++) {
            // สร้างพิกัดแนวโค้ง (Arch) กระจายแรงดันน้ำ
            let theta = (Math.random() - 0.5) * 1.5; // มุมความโค้งหน้าเขื่อน
            let y = Math.random() * DAM_HEIGHT;      // ความสูง
            let r = DAM_RADIUS + (Math.random() * 20) * (1 - y/DAM_HEIGHT); // ฐานหนา ยอดบาง
            
            let x = r * Math.sin(theta);
            let z = r * Math.cos(theta) - DAM_RADIUS;

            damPositions[i*3] = x;
            damPositions[i*3 + 1] = y;
            damPositions[i*3 + 2] = z;

            // ไล่เฉดสีคอนกรีต
            damColors[i*3] = colorBase.r + Math.random()*0.1;
            damColors[i*3 + 1] = colorBase.g + Math.random()*0.1;
            damColors[i*3 + 2] = colorBase.b + Math.random()*0.1;
        }

        damGeometry.setAttribute('position', new THREE.BufferAttribute(damPositions, 3));
        damGeometry.setAttribute('color', new THREE.BufferAttribute(damColors, 3));
        
        const damMaterial = new THREE.PointsMaterial({ size: 1.5, vertexColors: true });
        const damVoxelMesh = new THREE.Points(damGeometry, damMaterial);
        scene.add(damVoxelMesh);

        // [Node 3: Fluid Dynamics - มวลน้ำแห่งความเมตตา]
        const WATER_VOXELS = 10000;
        const waterGeometry = new THREE.BufferGeometry();
        const waterPositions = new Float32Array(WATER_VOXELS * 3);
        
        for(let i = 0; i < WATER_VOXELS; i++) {
            let x = (Math.random() - 0.5) * 400;
            let y = Math.random() * (DAM_HEIGHT - 10); // ระดับน้ำกักเก็บ
            let z = -(Math.random() * 400) - 20; // มวลน้ำอยู่ด้านหลังเขื่อน

            waterPositions[i*3] = x;
            waterPositions[i*3 + 1] = y;
            waterPositions[i*3 + 2] = z;
        }

        waterGeometry.setAttribute('position', new THREE.BufferAttribute(waterPositions, 3));
        const waterMaterial = new THREE.PointsMaterial({ color: 0x00aaff, size: 2, transparent: true, opacity: 0.6 });
        const waterVoxelMesh = new THREE.Points(waterGeometry, waterMaterial);
        scene.add(waterVoxelMesh);

        // [Node 4: Metta Protocol Execution (Render Loop)]
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // สั่นพ้องอนุภาคน้ำเบาๆ จำลองคลื่นและการไหลเวียน
            let positions = waterVoxelMesh.geometry.attributes.position.array;
            for(let i = 0; i < WATER_VOXELS; i++) {
                positions[i*3 + 1] += Math.sin(time * 2 + positions[i*3]) * 0.05;
            }
            waterVoxelMesh.geometry.attributes.position.needsUpdate = true;

            // หมุนกล้องช้าๆ เพื่อแสดงทัศนียภาพ 360 องศา
            camera.position.x = Math.sin(time * 0.1) * 400;
            camera.position.z = Math.cos(time * 0.1) * 400;
            camera.lookAt(0, 50, 0);

            renderer.render(scene, camera);
        }

        // จัดการเมื่อเปลี่ยนขนาดหน้าจอ
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // สัมปติฉามิ - จุดระเบิดระบบ
        animate();
    </script>
</body>
</html>
