<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Voxel OS - Bhumibol Dam Masterpiece Edition</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; /* บรรยากาศกลางวัน สีฟ้าสว่าง (Daylight) */
            font-family: 'Courier New', Courier, monospace;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85); /* แผงหน้าปัดสีสว่าง */
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #0055ff;
            color: #333;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            min-width: 330px;
        }
        h3 { margin-top: 0; color: #0044cc; text-align: center; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
        .data-value { color: #d90000; font-size: 1.1em; }
        hr { border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div id="hud">
        <h3>[เขื่อนภูมิพล - Voxel OS]</h3>
        <div class="data-row"><span>Target Lock:</span> <span>17.2403°N, 98.9644°E</span></div>
        <div class="data-row"><span>Structure:</span> <span>Arch Dam</span></div>
        <div class="data-row"><span>Radius / Height:</span> <span>250m / 154m</span></div>
        <hr>
        <div class="data-row"><span>Water Volume:</span> <div><span class="data-value" id="water-vol">13,462,000,000</span> m³</div></div>
        <div class="data-row"><span>Water Weight:</span> <div><span class="data-value" id="water-weight">13,462,000,000</span> Tons</div></div>
        <hr>
        <div style="font-size: 0.8em; text-align: center; color: #007700;">Status: Daylight Metta Protocol Executing... OK</div>
    </div>

    <!-- โหลด Three.js สำหรับ Voxel Render Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // [Node 1: Scene Setup (Daylight Theme)]
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.0012); // หมอกสีฟ้ากลมกลืนกับท้องฟ้า
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(0, 200, 500); 
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // เพิ่มแสงสว่าง (Sunlight)
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(100, 300, 100);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0xdddddd));

        // [Node 2: Voxel Engineering - Bhumibol Arch Dam]
        const DAM_RADIUS = 250; 
        const DAM_HEIGHT = 154;
        const DAM_VOXELS = 20000;
        
        const damGeo = new THREE.BufferGeometry();
        const damPos = new Float32Array(DAM_VOXELS * 3);
        const damCol = new Float32Array(DAM_VOXELS * 3);
        const concreteColor = new THREE.Color(0xd0d5d9); // สีคอนกรีตสว่าง

        for(let i = 0; i < DAM_VOXELS; i++) {
            let theta = (Math.random() - 0.5) * 1.6; // ความกว้างโค้ง
            let y = Math.random() * DAM_HEIGHT;      
            let r = DAM_RADIUS + (Math.random() * 25) * (1 - y/DAM_HEIGHT); // ฐานหนากว่ายอด
            
            let x = r * Math.sin(theta);
            let z = r * Math.cos(theta) - DAM_RADIUS;

            damPos[i*3] = x;
            damPos[i*3 + 1] = y;
            damPos[i*3 + 2] = z;

            let shade = Math.random() * 0.15;
            damCol[i*3] = concreteColor.r - shade;
            damCol[i*3 + 1] = concreteColor.g - shade;
            damCol[i*3 + 2] = concreteColor.b - shade;
        }
        damGeo.setAttribute('position', new THREE.BufferAttribute(damPos, 3));
        damGeo.setAttribute('color', new THREE.BufferAttribute(damCol, 3));
        const damMat = new THREE.PointsMaterial({ size: 2, vertexColors: true });
        scene.add(new THREE.Points(damGeo, damMat));

        // [Node 3: Voxel Mountains (Terrain Generation)]
        const MOUNT_VOXELS = 30000;
        const mountGeo = new THREE.BufferGeometry();
        const mountPos = new Float32Array(MOUNT_VOXELS * 3);
        const mountCol = new Float32Array(MOUNT_VOXELS * 3);
        
        for(let i = 0; i < MOUNT_VOXELS; i++) {
            let side = Math.random() > 0.5 ? 1 : -1;
            let x = side * (150 + Math.random() * 600); // ขนาบข้างเขื่อน
            let z = (Math.random() - 0.5) * 1000;
            let dist = Math.sqrt(x*x + z*z);
            let y = Math.random() * (dist * 0.35); // ยิ่งไกลยิ่งเป็นภูเขาสูง
            
            mountPos[i*3] = x;
            mountPos[i*3 + 1] = y;
            mountPos[i*3 + 2] = z;

            // สีเขียวธรรมชาติและหินภูเขา
            let c = Math.random() > 0.4 ? new THREE.Color(0x4a6b46) : new THREE.Color(0x6b5744);
            let shade = Math.random() * 0.1;
            mountCol[i*3] = c.r + shade;
            mountCol[i*3 + 1] = c.g + shade;
            mountCol[i*3 + 2] = c.b + shade;
        }
        mountGeo.setAttribute('position', new THREE.BufferAttribute(mountPos, 3));
        mountGeo.setAttribute('color', new THREE.BufferAttribute(mountCol, 3));
        scene.add(new THREE.Points(mountGeo, new THREE.PointsMaterial({ size: 3, vertexColors: true })));

        // [Node 4: Fluid Dynamics - Voxel Water with Waves]
        const WATER_VOXELS = 15000;
        const waterGeo = new THREE.BufferGeometry();
        const waterPos = new Float32Array(WATER_VOXELS * 3);
        
        for(let i = 0; i < WATER_VOXELS; i++) {
            let x = (Math.random() - 0.5) * 500;
            let y = Math.random() * (DAM_HEIGHT - 15); 
            let z = -(Math.random() * 600) - 50; 
            
            // เน้นความหนาแน่นที่ผิวน้ำเพื่อให้เห็นคลื่นชัดเจน
            if(Math.random() > 0.6) y = (DAM_HEIGHT - 15) - Math.random() * 5; 

            waterPos[i*3] = x;
            waterPos[i*3 + 1] = y;
            waterPos[i*3 + 2] = z;
        }
        waterGeo.setAttribute('position', new THREE.BufferAttribute(waterPos, 3));
        const waterMat = new THREE.PointsMaterial({ color: 0x0077ff, size: 2.5, transparent: true, opacity: 0.8 });
        const waterMesh = new THREE.Points(waterGeo, waterMat);
        scene.add(waterMesh);

        // [Node 5: Metta Protocol Real-time Render & Telemetry Update]
        let clock = new THREE.Clock();
        const baseVolume = 13462000000;
        const volElement = document.getElementById('water-vol');
        const weightElement = document.getElementById('water-weight');

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // ไดนามิกของมวลน้ำ (Wave Fluid Simulation)
            let positions = waterMesh.geometry.attributes.position.array;
            for(let i = 0; i < WATER_VOXELS; i++) {
                if(positions[i*3 + 1] > DAM_HEIGHT - 25) { // กระเพื่อมเฉพาะผิวน้ำ
                    positions[i*3 + 1] += Math.sin(time * 3 + positions[i*3]*0.05) * 0.08;
                }
            }
            waterMesh.geometry.attributes.position.needsUpdate = true;

            // อัปเดตหน้าปัดปริมาตรและน้ำหนักเรียลไทม์
            // สมมติการไหลเวียนของน้ำ ทำให้เกิดความผันผวนเล็กน้อย 
            let fluctuation = Math.floor(Math.sin(time * 0.8) * 24000); 
            let currentData = baseVolume + fluctuation;
            let formattedValue = currentData.toLocaleString('en-US');
            
            volElement.innerText = formattedValue;
            weightElement.innerText = formattedValue;

            // หมุนกล้องเพื่อพรีเซนต์ความยิ่งใหญ่ของสถาปัตยกรรม (Cinematic Pan)
            camera.position.x = Math.sin(time * 0.1) * 350;
            camera.position.z = Math.cos(time * 0.1) * 350 + 150;
            camera.lookAt(0, 60, -100);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // จุดเครื่องยนต์ควอนตัม 
        animate();
    </script>
</body>
</html>
